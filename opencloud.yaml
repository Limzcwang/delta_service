# OpenCloud 部署配置文件
# Delta Service - 实时通信服务

apiVersion: v1
kind: Application
metadata:
  name: delta-service
  namespace: default
  labels:
    app: delta-service
    version: v1.0.0

spec:
  # 应用基本信息
  description: "Delta Service - 实时通信服务"
  version: "1.0.0"
  
  # 容器配置
  containers:
  - name: delta-service
    image: delta-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    
    # 端口配置
    ports:
    - name: http-api
      containerPort: 8000
      protocol: TCP
    - name: websocket
      containerPort: 8765
      protocol: TCP
    
    # 资源限制
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    
    # 环境变量
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: LOG_LEVEL
      value: "INFO"
    
    # 健康检查
    livenessProbe:
      httpGet:
        path: /docs
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    
    readinessProbe:
      httpGet:
        path: /docs
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    
    # 启动命令
    command: ["python"]
    args: ["main.py"]
    
    # 卷挂载（日志持久化）
    volumeMounts:
    - name: logs-volume
      mountPath: /app/logs
      readOnly: false
  
  # 服务配置
  service:
    type: LoadBalancer
    ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: websocket
      port: 8765
      targetPort: 8765
      protocol: TCP
    
    # 服务发现
    selector:
      app: delta-service
  
  # 存储卷配置
  volumes:
  - name: logs-volume
    persistentVolumeClaim:
      claimName: delta-service-logs-pvc
  
  # 自动扩缩容配置
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  
  # 网络策略
  networkPolicy:
    ingress:
    - from:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 8765
  
  # 部署策略
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # 监控配置
  monitoring:
    enabled: true
    metrics:
      - name: http_requests_total
        type: counter
        help: "Total HTTP requests"
      - name: websocket_connections
        type: gauge
        help: "Current WebSocket connections"
      - name: response_time
        type: histogram
        help: "HTTP response time"

---
# 持久化存储配置
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delta-service-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
# 服务配置
apiVersion: v1
kind: Service
metadata:
  name: delta-service
spec:
  selector:
    app: delta-service
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: websocket
    port: 8765
    targetPort: 8765
    protocol: TCP
  type: LoadBalancer