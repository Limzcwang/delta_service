name: Deploy to Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Docker environment
      run: |
        echo "🔍 检查Docker环境..."
        if ! command -v docker &> /dev/null; then
          echo "❌ Docker未安装"
          exit 1
        fi
        
        if ! systemctl is-active --quiet docker; then
          echo "🚀 启动Docker服务..."
          sudo systemctl start docker || exit 1
        fi
        
        echo "✅ Docker环境正常"

    - name: Build Docker image
      run: |
        echo "🏗️ 构建Docker镜像..."
        docker build -t delta-service .
        echo "✅ 镜像构建完成"

    - name: Test Docker image
      run: |
        echo "🧪 测试镜像启动..."
        # 清理可能存在的测试容器
        docker stop test-container 2>/dev/null || true
        docker rm test-container 2>/dev/null || true
        
        # 启动测试容器
        docker run -d --name test-container -p 18000:8000 delta-service
        sleep 15
        
        # 检查服务是否正常响应
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18000/docs || echo "000")
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "❌ 镜像测试失败，HTTP状态码: $HTTP_STATUS"
          docker logs test-container
          exit 1
        fi
        
        echo "✅ 镜像测试通过"
        docker stop test-container
        docker rm test-container

    - name: Deploy application
      run: |
        echo "🚀 开始部署应用..."
        
        # 停止并清理旧容器
        docker stop delta-service-container 2>/dev/null || true
        docker rm delta-service-container 2>/dev/null || true
        docker rmi delta-service 2>/dev/null || true
        
        # 运行新容器
        docker run -d \
          --name delta-service-container \
          -p 8000:8000 \
          -p 8765:8765 \
          --restart unless-stopped \
          delta-service
        
        echo "⏳ 等待服务启动..."
        sleep 25
        
        # 健康检查
        CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' delta-service-container 2>/dev/null || echo "unknown")
        if [ "$CONTAINER_STATUS" != "running" ]; then
          echo "❌ 容器未正常运行"
          docker logs delta-service-container
          exit 1
        fi
        
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs || echo "000")
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "❌ 健康检查失败，状态码: $HTTP_STATUS"
          docker logs delta-service-container
          exit 1
        fi
        
        echo "✅ 部署成功！服务运行正常"

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 部署成功！服务已更新到最新版本"
        else
          echo "❌ 部署失败，请检查日志详情"
        fi