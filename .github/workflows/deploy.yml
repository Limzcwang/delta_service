name: Deploy to Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 最小权限：部署只需要读代码
permissions:
  contents: read

# 同一时间只允许一个部署，避免并发把容器换掉
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 数据库凭据由 self-hosted runner 本机的 root:runneruser 0640 文件提供，
  # 不进仓库、不进 Actions 日志、不在命令行参数里出现。
  DB_ENV_FILE: /etc/delta-service/db.env

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preflight
        run: |
          set -euo pipefail
          echo "🔍 检查 Docker 环境..."
          command -v docker >/dev/null || { echo "❌ Docker 未安装"; exit 1; }
          systemctl is-active --quiet docker || sudo systemctl start docker
          echo "🔍 检查数据库环境文件..."
          test -r "$DB_ENV_FILE" || { echo "❌ 缺少可读的 $DB_ENV_FILE"; exit 1; }
          echo "✅ 环境检查通过"

      - name: Build image
        run: |
          set -euo pipefail
          echo "🏗️ 构建镜像..."
          # 国内镜像源预拉基础镜像（本机/内网 mirror），避免 Docker Hub 不可达
          docker pull mirror.ccs.tencentyun.com/library/python:3.11-slim || true
          docker tag mirror.ccs.tencentyun.com/library/python:3.11-slim python:3.11-slim || true
          # 不要用会改 daemon.json 并重启整个 Docker 的构建脚本（原 docker-build-optimize.sh 已删除）
          docker build -t delta-service .
          echo "✅ 镜像构建完成"

      - name: Smoke test
        run: |
          set -euo pipefail
          echo "🧪 冒烟测试..."
          docker rm -f delta-service-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f delta-service-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name delta-service-smoke -p 18000:8000 --env-file "$DB_ENV_FILE" delta-service
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18000/docs || echo 000)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "❌ 冒烟测试失败，HTTP 状态码: $code"
            docker logs delta-service-smoke
            exit 1
          fi
          echo "✅ 冒烟测试通过"

      - name: Deploy application
        run: |
          set -euo pipefail
          echo "🚀 部署应用..."
          docker rm -f delta-service-container >/dev/null 2>&1 || true
          docker run -d \
            --name delta-service-container \
            -p 8000:8000 \
            --restart unless-stopped \
            --env-file "$DB_ENV_FILE" \
            delta-service
          echo "⏳ 等待服务启动..."
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "❌ 健康检查失败，状态码: $code"
            docker logs delta-service-container
            exit 1
          fi
          echo "✅ 部署成功"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 部署成功"
          else
            echo "❌ 部署失败，请检查日志"
          fi
