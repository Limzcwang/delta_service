name: Deploy to Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        docker build -t delta-service .

    - name: Test Docker image
      run: |
        # 测试镜像是否能正常启动
        docker run -d --name test-container -p 18000:8000 delta-service
        sleep 30
        
        # 检查服务是否正常响应
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18000/docs || echo "000")
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "❌ 镜像测试失败，HTTP状态码: $HTTP_STATUS"
          docker logs test-container
          exit 1
        fi
        
        echo "✅ 镜像测试通过"
        docker stop test-container
        docker rm test-container

    - name: Save Docker image
      run: |
        docker save delta-service -o delta-service.tar

    - name: Deploy to server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_PORT: ${{ secrets.SERVER_PORT }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        set -e
        
        echo "🔑 配置SSH连接..."
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        
        # 上传镜像
        scp -o StrictHostKeyChecking=no -P "$SERVER_PORT" delta-service.tar "$SERVER_USER@$SERVER_HOST:/tmp/"
        
        # 远程执行脚本（注意这里的缩进和引号）
        ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" << 'REMOTE_SCRIPT'
        set -e
        
        # 检查 Docker
        if ! command -v docker &> /dev/null; then
          echo "Docker未安装"
          exit 1
        fi
        
        if ! systemctl is-active --quiet docker; then
          sudo systemctl start docker || exit 1
        fi
        
        # 清理旧容器
        docker stop delta-service-container 2>/dev/null || true
        docker rm delta-service-container 2>/dev/null || true
        docker rmi delta-service 2>/dev/null || true
        
        # 加载并运行新镜像
        docker load -i /tmp/delta-service.tar
        docker run -d \
          --name delta-service-container \
          -p 8000:8000 \
          -p 8765:8765 \
          --restart unless-stopped \
          delta-service
        
        # 清理临时文件
        rm -f /tmp/delta-service.tar
        
        # 健康检查
        sleep 15
        
        CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' delta-service-container 2>/dev/null || echo "unknown")
        if [ "$CONTAINER_STATUS" != "running" ]; then
          echo "容器未正常运行"
          docker logs delta-service-container
          exit 1
        fi
        
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs || echo "000")
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "健康检查失败，状态码: $HTTP_STATUS"
          docker logs delta-service-container
          exit 1
        fi
        
        echo "部署成功"
        REMOTE_SCRIPT

    - name: Cleanup
      if: always()
      run: |
        echo "🧹 清理临时文件..."
        rm -f delta-service.tar
        rm -f ~/.ssh/id_rsa

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 部署成功！服务已更新到最新版本"
        else
          echo "❌ 部署失败，请检查日志详情"
        fi